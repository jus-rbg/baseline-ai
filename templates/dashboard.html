<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Baseline AI — Dashboard</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js" defer></script>
  <script defer src="/static/app.js"></script>
</head>
<body>
  <header class="container">
    <h1>Baseline AI <span class="tag">Hackathon MVP</span></h1>
    <p class="subtitle">AI-powered templates • Baseline compatibility • Real-time collaboration</p>
  </header>

  <main class="container grid">
    <section class="card">
      <h2>AI Suggestion</h2>
      <form id="suggest-form">
        <div class="row">
          <label>Project type</label>
          <select name="project_type">
            <option>Web App</option>
            <option>Extension</option>
            <option>Docs Tool</option>
            <option>Analytics</option>
            <option>AI Demo</option>
          </select>
        </div>
        <div class="row">
          <label>Language</label>
          <select name="language">
            <option>Python</option>
            <option>JavaScript</option>
            <option>TypeScript</option>
            <option>Go</option>
            <option>Rust</option>
          </select>
        </div>
        <div class="row">
          <label>Use case</label>
          <input type="text" name="use_case" placeholder="e.g. PWA for offline docs" />
        </div>
        <button type="submit">Generate Plan</button>
      </form>
      <div id="suggest-output" class="list"></div>
    </section>

    <section class="card">
      <h2>Baseline Check</h2>
      <form id="baseline-form">
        <div class="row">
          <label>Features (comma-separated IDs)</label>
          <input type="text" name="features" placeholder="e.g. pwa, fetch-api, web-components" />
        </div>
        <button type="submit">Check Compatibility</button>
      </form>
      <div id="baseline-output" class="list"></div>
    </section>

    <section class="card">
      <h2>Recent Events</h2>
      <ul id="events"></ul>
    </section>
  </main>

  <footer class="container">
    <p>© 2025 Baseline AI • <a href="https://baseline.devpost.com" target="_blank" rel="noopener">Hackathon</a></p>
  </footer>
</body>
</html>
